name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type-check extension
        run: bunx tsc --noEmit
      - name: Build + package
        run: bun run package
      - name: Upload prod zip
        uses: actions/upload-artifact@v4
        with:
          # Download via Actions → run → "Artifacts" panel. Use this zip for
          # the very first manual CWS upload; subsequent releases go through
          # the publish workflow on tag.
          name: refine-chrome-mv3-prod
          path: build/chrome-mv3-prod.zip
          if-no-files-found: error
          retention-days: 30
